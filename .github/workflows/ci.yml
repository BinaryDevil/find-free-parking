name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migration immutability
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$MIGRATION_BASE" = "0000000000000000000000000000000000000000" ]; then
            MIGRATION_BASE="$(git merge-base HEAD origin/dev)"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/dev" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            MIGRATION_BASE="origin/dev"
          fi
          node scripts/check-migration-files.mjs "$MIGRATION_BASE"
      - name: Lint against recorded debt
        run: pnpm lint
      - name: Typecheck against recorded debt
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
