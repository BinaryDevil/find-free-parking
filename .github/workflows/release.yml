name: Production release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  credentials:
    environment: production
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      # Environment secrets are available only after this job starts. Never emit
      # their values; the downstream production job receives only a boolean.
      - id: check
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          if [ -n "$NEON_API_KEY" ] && [ -n "$PRODUCTION_MIGRATION_DATABASE_URL" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authorize optional adoption tooling
        id: tooling
        run: node scripts/release.mjs --prepare
        env:
          GH_TOKEN: ${{ github.token }}
      # Ubuntu's default client is 16; adoption references require an exact 17.x
      # client version. PGDG is the official PostgreSQL package repository.
      - name: Install PostgreSQL 17 client for reviewed adoption
        if: steps.tooling.outputs.needs_pg_dump == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Authorize, snapshot, migrate and smoke-check
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          PRODUCTION_BASELINE_REFERENCE_METADATA: ${{ secrets.PRODUCTION_BASELINE_REFERENCE_METADATA }}
          PRODUCTION_BASELINE_REFERENCE_SCHEMA: ${{ secrets.PRODUCTION_BASELINE_REFERENCE_SCHEMA }}
